version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: clg-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./data:/data/nginx
    restart: unless-stopped
    networks:
      - clg-network
    depends_on:
      fastapi:
        condition: service_healthy

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clg-fastapi
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/clg_vermoegensschutz.db
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://clg-redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
    networks:
      - clg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: clg-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - clg-network

networks:
  clg-network:
    driver: bridge
