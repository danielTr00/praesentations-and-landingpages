server {
    listen 80;
    server_name clg-protect.de www.clg-protect.de;

    # Security Headers (Maximum Security)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; frame-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/m;

    # Gzip + Brotli Compression (handled by FastAPI backend, but static files here)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Backend API reverse proxy
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://clg-fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Panel reverse proxy (stricter rate limit)
    location /admin/ {
        limit_req zone=admin_limit burst=5 nodelay;
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ =404;
    }

    # Landing page
    location /landing/ {
        alias /usr/share/nginx/html/frontend/;
        try_files $uri $uri/ /landing/index.html;
    }

    # Root landing page redirect
    location / {
        return 301 /landing/;
    }

    # Static files caching (90 days)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        expires 90d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /healthcheck {
        return 200 '{"status": "healthy"}';
        add_header Content-Type application/json;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
