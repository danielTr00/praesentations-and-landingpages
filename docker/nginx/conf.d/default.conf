server {
    listen 80;
    server_name _;

     # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;"  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

     # Rate limiting for API
    location /api/ {
        limit_req zone=form_limit burst=3 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
         # Timeout settings
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

     # Health check endpoint for fastapi
    location /health {
        proxy_pass http://fastapi:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

     # Webhook endpoint (higher rate limit)
    location /api/webhooks/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://fastapi:8000/api/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
         # Larger body for webhook payloads with binary data
        client_max_body_size 10m;
    }

     # Admin panel API (stricter rate limiting)
    location /api/admin/ {
        limit_req zone=form_limit burst=2 nodelay;
        proxy_pass http://fastapi:8000/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

     # Static files
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
         Gzip + Brotli already enabled at http level
    }

     # Main landing page
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

     # Cache static assets aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        alias /usr/share/nginx/html/static/;
        expires 90d;
        add_header Cache-Control "public, immutable";
    }

     # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
